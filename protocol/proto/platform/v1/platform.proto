syntax = "proto3";

package liveshop.platform.v1;

option go_package = "github.com/liveshop-platform/contracts/gen/go/platform/v1;platformv1";

// PlatformRegistryService publishes immutable control-plane snapshots to
// authorized infrastructure workloads. Active capabilities are consumed only
// by Identity over mTLS to calculate Module Capability grants.
service PlatformRegistryService {
  rpc GetRouteSnapshot(GetRouteSnapshotRequest) returns (GetRouteSnapshotResponse);
  rpc GetActiveCapabilitySnapshot(GetActiveCapabilitySnapshotRequest) returns (GetActiveCapabilitySnapshotResponse);
}

message GetRouteSnapshotRequest {}

message GetRouteSnapshotResponse {
  uint64 revision = 1;
  repeated ActiveRoute routes = 2;
}

message ActiveRoute {
  string module_id = 1;
  string surface = 2;
  string prefix = 3;
  string service = 4;
  string origin = 5;
  repeated ActiveRouteOperation operations = 6;
}

message ActiveRouteOperation {
  string method = 1;
  string path = 2;
  string authentication = 3;
}

message GetActiveCapabilitySnapshotRequest {}

message GetActiveCapabilitySnapshotResponse {
  uint64 registry_revision = 1;
  repeated ActiveModuleCapability modules = 2;
}

message ActiveModuleCapability {
  string module_id = 1;
  string module_name = 2;
  string release_version = 3;
  string release_digest = 4;
  repeated PermissionDefinition permissions = 5;
  repeated ActiveContribution contributions = 6;
  repeated HttpOperation http_operations = 7;
  GrpcContract grpc = 8;
  Backend backend = 9;
}

message PermissionDefinition {
  string code = 1;
  string name = 2;
  string resource = 3;
  string action = 4;
  string description = 5;
}

message ActiveContribution {
  string contribution_id = 1;
  string surface = 2;
  string kind = 3;
  string route = 4;
  string outlet = 5;
  string title = 6;
  string description = 7;
  string icon = 8;
  int32 sort = 9;
  Navigation navigation = 10;
  repeated string required_permissions = 11;
  repeated AllowedRoute allowed_routes = 12;
  repeated FrontendAction frontend_actions = 13;
  Artifact artifact = 14;
  FrontendContract frontend = 15;
}

message Navigation {
  string group_id = 1;
  string group_title = 2;
  int32 group_sort = 3;
}

message AllowedRoute {
  repeated string methods = 1;
  string prefix = 2;
  repeated string required_permissions = 3;
}

message HttpOperation {
  string operation_id = 1;
  string surface = 2;
  string method = 3;
  string path = 4;
  string summary = 5;
  string description = 6;
  string authentication = 7;
  string idempotency = 8;
  repeated string required_permissions = 9;
  repeated CapabilityField request_fields = 10;
  repeated CapabilityResponse responses = 11;
}

message FrontendAction {
  string action_id = 1;
  string label = 2;
  string description = 3;
  string invocation = 4;
  string target = 5;
  repeated string required_permissions = 6;
  repeated CapabilityField parameters = 7;
}

message Artifact {
  string type = 1;
  string name = 2;
  string version = 3;
  string entry = 4;
  string export_name = 5;
  string integrity = 6;
}

message FrontendContract {
  string component = 1;
  repeated CapabilityField props = 2;
  repeated FrontendEvent events = 3;
  repeated FrontendAction actions = 4;
}

message FrontendEvent {
  string name = 1;
  string description = 2;
  repeated CapabilityField payload = 3;
}

message CapabilityField {
  string name = 1;
  string location = 2;
  string type = 3;
  string format = 4;
  bool required = 5;
  string description = 6;
  string example = 7;
}

message CapabilityResponse {
  int32 status = 1;
  string description = 2;
  repeated CapabilityField fields = 3;
}

message GrpcContract {
  string service = 1;
  string contract_version = 2;
  string endpoint = 3;
  string transport_security = 4;
  repeated GrpcMethod methods = 5;
}

message GrpcMethod {
  string name = 1;
  string full_method = 2;
  string summary = 3;
  string description = 4;
  string invocation = 5;
  string idempotency = 6;
  int32 recommended_deadline_ms = 7;
  repeated string required_permissions = 8;
  repeated CapabilityField request_fields = 9;
  repeated CapabilityField response_fields = 10;
}

message Backend {
  string service = 1;
  string origin = 2;
}

// PlatformNotificationService is the unified Dispatch contract. It is not part
// of PlatformRegistryService: snapshots stay read-only, notifications are writes
// after a business transaction commits.
service PlatformNotificationService {
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
  rpc GetDelivery(GetDeliveryRequest) returns (GetDeliveryResponse);
}

message DispatchRequest {
  string event_key = 1;
  string delivery_key = 2;
  int64 merchant_id = 3;
  int64 shop_id = 4;
  NotificationRecipients recipients = 5;
  map<string, string> variables = 6;
  int64 not_before_unix_ms = 7;
  string locale = 8;
}

message NotificationRecipients {
  string phone = 1;
  string email = 2;
  string subject = 3;
}

message DispatchResponse {
  repeated NotificationDeliveryResult deliveries = 1;
}

message NotificationDeliveryResult {
  string delivery_id = 1;
  string channel = 2;
  string status = 3;
  bool deduped = 4;
}

message GetDeliveryRequest {
  string delivery_id = 1;
}

message GetDeliveryResponse {
  string delivery_id = 1;
  string delivery_key = 2;
  string event_key = 3;
  string channel = 4;
  string status = 5;
  int64 merchant_id = 6;
  int64 shop_id = 7;
  int64 not_before_unix_ms = 8;
  string last_error = 9;
  int32 attempt_count = 10;
}
