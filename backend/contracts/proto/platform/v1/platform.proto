syntax = "proto3";

package liveshop.platform.v1;

option go_package = "github.com/liveshop-platform/contracts/gen/go/platform/v1;platformv1";

// PlatformRegistryService publishes immutable control-plane snapshots to
// authorized workloads. The module manifest JSON remains the capability
// contract source of truth carried by CapabilityRelease.manifest_json.
service PlatformRegistryService {
  rpc GetRouteSnapshot(GetRouteSnapshotRequest) returns (GetRouteSnapshotResponse);
  rpc GetCapabilityCatalog(GetCapabilityCatalogRequest) returns (GetCapabilityCatalogResponse);
}

message GetRouteSnapshotRequest {}

message GetRouteSnapshotResponse {
  uint64 revision = 1;
  repeated ActiveRoute routes = 2;
}

message ActiveRoute {
  string module_id = 1;
  string surface = 2;
  string prefix = 3;
  string service = 4;
  string origin = 5;
}

message GetCapabilityCatalogRequest {}

message GetCapabilityCatalogResponse {
  uint64 revision = 1;
  repeated ModuleCapabilityCatalog items = 2;
}

message ModuleCapabilityCatalog {
  string module_id = 1;
  string name = 2;
  string active_version = 3;
  repeated CapabilityRelease releases = 4;
}

message CapabilityRelease {
  string version = 1;
  string digest = 2;
  bool active = 3;
  // Canonical UTF-8 JSON encoded liveshop.io/v1 ModuleRelease manifest.
  bytes manifest_json = 4;
}
