# 仅用于 backend/deploy/compose.local.yml 的本地开发配置，禁止用于生产。
service: platform
log:
  level: info
  format: text
server:
  http: ":18082"
  grpc: ":19082"
database:
  url: liveshop:liveshop-local@tcp(registry-db:3306)/liveshop_registry?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_0900_ai_ci
  max_open_connections: 40
  max_idle_connections: 10
  connection_max_lifetime: 30m
  connection_max_idle_time: 5m
credential_encryption:
  key_id: platform-live-provider-dev-1
  master_key: bGl2ZXNob3AtbG9jYWwtZGV2LWtleS0zMi1ieXRlcyE=
module_capability:
  key_id: module-capability-dev-1
  public_key: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
  issuer: liveshop-identity
workload_identity:
  issuer: liveshop-workload-identity
  http:
    identity:
      key_id: identity-workload-dev-1
      public_key: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
      subject: identity
      permissions: [platform.notify-event.dispatch]
  grpc:
    identity:
      spiffe_id: spiffe://liveshop.local/identity
      subject: liveshop-identity
      permissions: [platform.notify-event.dispatch]
internal_grant:
  token: liveshop-local-internal-grant
registry:
  origin_url: http://registry:18070
  workload:
    key_id: platform-registry-client-dev-1
    private_key: Yjrd7sO3a3pVqzJ4WcI8A57yu17ZLNZ2zOjFYzMuH7o
    issuer: liveshop-workload-identity
    subject: liveshop-platform
edge:
  enabled: false
  identity_origin: http://identity:18092
  ask_origin: http://platform:18082
  caddy_admin: ""
  caddyfile: ""
  acme_email: ""
  upstreams:
    shop: shop-host:18080
    live: live-host:18080
    merch: merch-host:18080
    admin: admin-host:18080
    rts: gateway:18081
    gateway: gateway:18081
http:
  allowed_origins: [http://gateway.internal]
grpc:
  tls:
    certificate_file: /run/grpc/server.pem
    private_key_file: /run/grpc/server-key.pem
    client_ca_file: /run/grpc/ca.pem
