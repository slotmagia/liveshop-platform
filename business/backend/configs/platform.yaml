service: platform
log:
  level: info
  format: text
server:
  http: ":18082"
  grpc: ":19082"

# 部署必须提供一份完整配置文件；空值会在启动校验阶段失败。
database:
  url: ""
  max_open_connections: 40
  max_idle_connections: 10
  connection_max_lifetime: 30m
  connection_max_idle_time: 5m
credential_encryption:
  key_id: ""
  master_key: ""
module_capability:
  key_id: ""
  public_key: ""
  issuer: liveshop-identity
workload_identity:
  issuer: liveshop-workload-identity
  http:
    identity:
      key_id: ""
      public_key: ""
      subject: identity
      permissions: [platform.notify-event.dispatch]
  grpc:
    identity:
      spiffe_id: spiffe://liveshop.local/identity
      subject: liveshop-identity
      permissions: [platform.notify-event.dispatch]
internal_grant:
  token: ""
registry:
  origin_url: ""
  workload:
    key_id: ""
    private_key: ""
    issuer: liveshop-workload-identity
    subject: liveshop-platform
edge:
  enabled: false
  identity_origin: ""
  ask_origin: ""
  caddy_admin: ""
  caddyfile: ""
  acme_email: ""
  upstreams:
    shop: ""
    live: ""
    merch: ""
    admin: ""
    rts: ""
    gateway: ""
http:
  allowed_origins: []
grpc:
  tls:
    certificate_file: ""
    private_key_file: ""
    client_ca_file: ""
