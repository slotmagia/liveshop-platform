name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  workspace:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: platform_verify
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: liveshop-platform
      - uses: actions/checkout@v4
        with:
          repository: lvtuopen-ai/kernel-go
          path: kernel-go
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x'}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: liveshop-platform/package-lock.json
      - shell: pwsh
        working-directory: liveshop-platform
        env:
          PLATFORM_TEST_DATABASE_URL: postgres://platform:platform@127.0.0.1:5432/platform_verify?sslmode=disable
        run: |
          npm ci
          ./backend/tools/verify-module.ps1
